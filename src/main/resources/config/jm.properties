### JM漫画配置

# jm本子zip包解压密码
# 注意：修改密码不会改变之前已经存在的zip包密码，重复下载可重新生成使用新密码的zip包
jm.password.zip=1234

# jm本子pdf保护密码
# 注意：修改密码不会改变之前已经存在的pdf文件密码，重复下载可重新生成使用新密码的pdf文件
jm.password.pdf=1234

# 下载本子时线程数量，未配置、0或小于0则等于CPU逻辑核心数量
jm.download.threads=0

# JM漫画操作是否允许不同JM ID并发执行
# true：不同JM ID可并发；false：所有JM操作串行执行
jm.operation.parallel.enabled=false

# jm本子文件夹名称最大长度（注意是名称的bytes.length而非字符个数，不含_JM{id}后缀）
# 本子名会作为下载后的文件夹名称使用，linux文件名上限255字节，这里需小于255
# 名称中的windows非法字符（\ / : * ? " < > |）会被替换为'-'，超长部分按字符边界截断，_JM{id}后缀不参与截断
jm.album.name_max_length=150

# JM API域名（本子详情 / 搜索 / 章节清单走的线路）
# 配置管理页是一个下拉框，候选项来自服务端的 JM 线路清单（内置默认线路 + 官方线路1~5）
# 下拉框右侧可以点「测速」：逐条请求各线路，显示耗时后选延迟最低的那条即可
jm.api_domain=www.cdnbea.net

# JM 图片域名（章节图片与封面走的图片CDN）
# 同样可以在配置管理页下拉选择并测速；内置默认线路 + 12 条实测图源
# 注意：图片线路换了一条连不上的，下载会失败（和以前手填一个死域名是同一结果）
jm.image_domain=cdn-msp2.jmapiproxy2.cc

# JM搜索结果是否以HTML转图片方式发送
# true：图片发送；false：合并消息发送
jm.search_result.image_mode=false

# JM搜索结果返回条数上限，图片和合并消息共用；未配置、无效或小于等于0时使用12条
jm.search_result.limit=12

# JM在线搜索历史保存条数
# 超出后会删除最旧的记录；未配置、无效或小于等于0时不保存历史
jm.search.history.limit=20

# 以下三个是JM接口的网络超时（连接超时/读超时/写超时）重试次数，单位：次
# 0=不重试（默认）；仅超时会重试，其它异常（如404、解密失败）不会重试
# 重试采用指数退避（1s、2s、4s...），重试期间沿用第一次请求的签名时间戳，保证响应能正常解密

# 请求本子详情 /album 的最大重试次数
jm.request.album.retry=0

# JM搜索 /search 的最大重试次数
jm.request.search.retry=0

# 请求章节详情 /chapter 的最大重试次数
jm.request.chapter.retry=0

# 是否加密保存JM漫画图片和封面
# true：新下载的图片/封面加密落盘，前端自行解密展示，生成zip/pdf时临时解密
# false：保持明文保存
# 注意：该配置只影响新下载的文件，切换后历史图片（明文或加密）都能正常读取
jm.image.encrypt.enabled=true

# 图片加密字节数，单位KB
# 0：整图加密
# 大于0：仅加密文件前N KB（N小于文件大小时，剩余部分保持明文；文件不足N KB则整图加密）
# 同样只影响新下载的文件，解密时按文件头记录的长度解密，不受该配置变化影响
jm.image.encrypt.prefix.kb=32

# 漫画图片解扰后是否重新压缩（只对"需要解扰的 webp"生效），同时决定生成 PDF 时是否压缩
# true：图片用有损 WebP q85、PDF 内嵌 JPEG q90（体积小，像素会有轻微损失）
# false：图片用无损 WebP q100、PDF 无损内嵌（像素完全不变，体积大很多）
# 不需要解扰的图片（未加扰章节、以及 jpg/gif 这类原图）一律按站点原始字节保存，
# 不重新编码——站点已经把图压好了，再编一遍只会把体积撑大、还会把 jpg 变成 webp 却留着旧扩展名
jm.image.compress.enabled=true

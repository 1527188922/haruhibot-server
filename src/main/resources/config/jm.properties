### JM漫画配置

# jm本子zip包解压密码
# 注意：修改密码不会改变之前已经存在的zip包密码，重复下载可重新生成使用新密码的zip包
jm.password.zip=1234

# jm本子pdf保护密码
# 注意：修改密码不会改变之前已经存在的pdf文件密码，重复下载可重新生成使用新密码的pdf文件
jm.password.pdf=1234

# 下载本子时线程数量，未配置、0或小于0则等于CPU逻辑核心数量
jm.download.threads=0

# JM漫画操作是否允许不同JM ID并发执行
# true：不同JM ID可并发；false：所有JM操作串行执行
jm.operation.parallel.enabled=false

# jm本子名称最大长度（注意是名称的bytes.length而非字符个数）
# 由于使用本子名做为下载后的本子文件名，linux系统文件名称最长支持255，这里要小于255
jm.album.name_max_length=215

# JM API域名
jm.api_domain=www.cdnbea.net

# JM搜索结果是否以HTML转图片方式发送
# true：图片发送；false：合并消息发送
jm.search_result.image_mode=false

# JM搜索结果返回条数上限，图片和合并消息共用；未配置、无效或小于等于0时使用12条
jm.search_result.limit=12

# JM在线搜索历史保存条数
# 超出后会删除最旧的记录；未配置、无效或小于等于0时不保存历史
jm.search.history.limit=20

### WebUI 登录、Token 与监控台配置
### 修改后需重启服务才能生效

# WebUI登录账号
login.username=haruhi

# WebUI登录密码，同时也是druid监控台的账号密码
login.password=123123

# 内存中token最大数量
login.session.max=6

# 内存token过期时长，单位分钟
login.expire=30

# JWT有效时长，单位小时
login.jwt.expire=24

# JWT签名密钥，留空会导致启动失败
login.jwt.secret=QBgu5c4xfA4_6Ky8A_QnO_XW238-YD7Y6EH7HQKAyM8OiCNbn6xCcN-5BaZGysxA

# JWT宽限时长（目前无用）
login.jwt.grace=30

# 是否开启druid监控台，访问路径 /druid
druid.enabled=false

# 是否开启druid的URL监控
druid.monitor.url.enabled=false

# druid的URL监控是否统计session
druid.monitor.url.session.enabled=false

# 是否开启druid的Spring监控
druid.monitor.spring.enabled=false

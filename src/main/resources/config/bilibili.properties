### B站相关配置

# 整条b站cookie：浏览器F12 -> Network -> 任意b站接口 -> Request Headers 里的 Cookie 整段复制
# 配置后覆盖下面 sessdata / bili_jct 的拼装逻辑（设备标识 buvid3/buvid4 仍会自动补齐），风控概率最低
bilibili.cookies.raw=

# b站cookie中的SESSDATA，用于解析b站视频等需要调用b站api的功能（已配置 bilibili.cookies.raw 时无需配置）
bilibili.cookies.sessdata=

# b站cookie中的bili_jct，用于解析b站视频等需要调用b站api的功能（已配置 bilibili.cookies.raw 时无需配置）
bilibili.cookies.bili_jct=

# 请求b站接口自动获取，非必要，可减小风控概率（由程序自动写入）
bilibili.cookies.ticket=

# 设备标识，程序首次请求b站接口时自动获取并写入，请勿手工修改
# 不带任何cookie的请求最容易被b站风控返回 -412「request was banned」
bilibili.cookies.buvid3=
bilibili.cookies.buvid4=

# 上传b站视频时长限制，单位秒
bilibili.upload_video.duration_limit=600

# 下载b站视频时长限制，单位秒
bilibili.download_video.duration_limit=600

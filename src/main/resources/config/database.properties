### 数据库连接配置
### 这里是数据源的唯一真源：
###   application*.yml 里的 spring.datasource 会被 SqliteDataSourceInitAspect 用本文件的值覆盖，
###   因此改数据源只需要改这个文件（修改后需重启）

# sqlite数据库jdbc url
# 默认值指向程序目录下的 data 目录：jdbc:sqlite::resource:data/haruhibot_server.db
# 也可以写绝对路径，windows 下建议用正斜杠，例如：
#   jdbc:sqlite:D:/my/bot/db/haruhibot_server.db
# sqlite 建议带上 ?journal_mode=WAL&synchronous=NORMAL
spring.datasource.dynamic.datasource.master.url=jdbc:sqlite::resource:data/haruhibot_server.db?journal_mode=WAL&synchronous=NORMAL

# 数据库驱动类名
spring.datasource.dynamic.datasource.master.driver-class-name=org.sqlite.JDBC

# druid连接校验语句
spring.datasource.dynamic.datasource.master.druid.validation-query=SELECT 1

# druid过滤器
spring.datasource.dynamic.datasource.master.druid.filters=stat

# druid取连接时是否校验
spring.datasource.dynamic.datasource.master.druid.test-on-borrow=false

# druid归还连接时是否校验
spring.datasource.dynamic.datasource.master.druid.test-on-return=false

# druid是否缓存PreparedStatement
spring.datasource.dynamic.datasource.master.druid.pool-prepared-statements=false

# druid最大连接数
spring.datasource.dynamic.datasource.master.druid.max-active=5

### 新闻配置
### 修改后即时生效

# uapis新闻图片接口，接口直接返回图片，请求时自动追加时间戳参数
news.uapis.url=https://uapis.cn/api/v1/daily/news-image

# 60秒读懂世界图片接口，{date}会替换为yyyy-MM-dd格式的当天日期
news.60s.url=https://60s-static.viki.moe/images/{date}.png

# alapi早报接口，format固定json，取响应中的data.image字段
news.alapi.url=https://v3.alapi.cn/api/zaobao

# alapi早报接口token 申请免费token：https://www.alapi.cn/api/67/introduction 100次/天
news.alapi.token=yOomUPkcTEVY9nMT

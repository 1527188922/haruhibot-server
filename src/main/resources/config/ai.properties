### AI模型配置
### 修改后即时生效，无需重启

# 阿里巴巴千问模型api key
qianwen.api_key=

# DeepSeek api key
ds.api.key=

# DeepSeek api baseurl
ds.api.base_url=https://api.deepseek.com

# DeepSeek 请求超时时长，单位秒
ds.api.timeout=30

### DeepSeek 群聊 / 私聊（详见 docs/ai-chat-design.md）
# 总开关；关闭时不会接管任何聊天，青云客保持原逻辑
ds.chat.enable=false

# 模型/生成参数
ds.chat.model=deepseek-flash
ds.chat.thinking=disabled
ds.chat.reasoning_effort=high
ds.chat.temperature=1.1
ds.chat.max_tokens=1024
ds.chat.retry=2
ds.chat.max_concurrent=4
ds.chat.daily_token_limit=0

# 会话/历史
ds.chat.session.expire_minutes=120
ds.chat.history.max_turns=20
ds.chat.history.max_input_tokens=12000
ds.chat.role=春日酱
ds.chat.role.max_chars=6000

# 长期记忆
ds.chat.memory.enable=true
ds.chat.memory.auto_save=true
ds.chat.memory.max_entries=20
ds.chat.memory.max_value_chars=200
ds.chat.memory.inject_max=10
ds.chat.dedupe_ttl_seconds=300
ds.chat.ignore_user_ids=
ds.chat.vision.enable=false

# 群聊启用与触发
ds.chat.group.whitelist=
ds.chat.group.trigger.at=true
ds.chat.group.trigger.reply=true
ds.chat.group.trigger.role=true
ds.chat.group.trigger.context_judge=true
ds.chat.group.trigger.address_words=你,您,在吗,出来,帮我,你觉得,你说,看看,怎么办,咋办
ds.chat.group.trigger.prefix=
ds.chat.group.trigger.keywords=
ds.chat.group.roles=
ds.chat.group.trigger.random_percent=0
ds.chat.group.ambient_size=20
ds.chat.group.min_reply_interval_ms=3000
ds.chat.group.max_replies_per_minute=6
ds.chat.group.user_cooldown_ms=10000
ds.chat.group.mention_delay_min_ms=5000
ds.chat.group.mention_delay_max_ms=15000
ds.chat.group.mention_delay_cap_ms=30000
ds.chat.group.at_only_delay_min_ms=15000
ds.chat.group.at_only_delay_max_ms=25000
ds.chat.group.reply_at_only=true

# 私聊与合并
ds.chat.private.enable=false
ds.chat.private.roles=
ds.chat.private.min_reply_interval_ms=1000
ds.chat.debounce.min_ms=2000
ds.chat.debounce.max_ms=6000
ds.chat.debounce.max_wait_ms=15000

# 发送
ds.chat.message.max_count=4
ds.chat.message.max_chars=300
ds.chat.message.max_delay_ms=5000
ds.chat.message.first_delay_ms=300
ds.chat.message.total_timeout_ms=30000

# 伪 Agent 工具
ds.chat.agent.enable=true
ds.chat.agent.max_steps=2
ds.chat.agent.tools=group_history,member_info,memory_append,memory_query,memory_forget
ds.chat.agent.tool_timeout_ms=5000
ds.chat.agent.max_result_chars=2000
ds.chat.agent.calls_per_turn=2
ds.chat.agent.calls_per_minute=6

# 持久化与余额
ds.chat.persistence.enable=true
ds.chat.persistence.max_messages_per_session=200
ds.chat.cleanup.retention_days=30
ds.chat.balance.refresh_minutes=10

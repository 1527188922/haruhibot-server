# dev profile config (active profile: dev)
#
# These files are read by both Configs and the Spring Environment.
#
# NOTE: the datasource is NOT configured here anymore.
# It is configured in ./config/database.properties and applied by
# com.haruhi.botServer.aop.SqliteDataSourceInitAspect, which overwrites
# whatever spring.datasource entry exists in yml.
server:
  # http port (editable from the WebUI config page, restart required)
  port: 8090

logging:
  level:
    com.haruhi.botServer: debug
